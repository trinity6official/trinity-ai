name: Trinity AI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test local Trinity runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python modules
        run: python -m compileall -q core voice skills agents

      - name: Run regression suite
        env:
          TRINITY_API_ENABLED: 'false'
          TRINITY_PRESENCE_ENABLED: 'false'
          TRINITY_VOICE_LISTENING_ENABLED: 'false'
          TRINITY_TELEGRAM_ENABLED: 'false'
        run: python -m pytest -q

name: Trinity AI

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

jobs:
  run-trinity:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install langchain-anthropic langchain-core langchain-community requests pyyaml python-dotenv apscheduler langdetect gtts

    - name: Run Trinity AI
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        python core/trinity.py

name: Trinity AI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test local Trinity runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Verify repository hygiene
        run: |
          python scripts/check_repository_hygiene.py --git-index
          python scripts/check_internal_imports.py --git-index
          git diff --check

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile and import production composition root
        run: |
          python -m compileall -q core voice skills agents
          python -c "import core.trinity"

      - name: Run architecture guardrails
        run: python -m pytest -q -m architecture

      - name: Run contract and integration safety suite
        env:
          TRINITY_API_ENABLED: 'false'
          TRINITY_PRESENCE_ENABLED: 'false'
          TRINITY_VOICE_LISTENING_ENABLED: 'false'
        run: python -m pytest -q -m "contract or integration or scenario or failure_path"

      - name: Run full regression suite
        env:
          TRINITY_API_ENABLED: 'false'
          TRINITY_PRESENCE_ENABLED: 'false'
          TRINITY_VOICE_LISTENING_ENABLED: 'false'
        run: python -m pytest -q -m "not network"

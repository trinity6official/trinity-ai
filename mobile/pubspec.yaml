name: trinity_voice
description: Trinity AI — Voice Interface
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── On-device Speech-to-Text ──────────────────────────────────────────────
  # Uses Android's built-in STT engine (Google on-device, no API key needed).
  # When the M5 is ready, switch to uploading raw audio to backend Google STT.
  speech_to_text: ^6.6.2

  # ── Audio playback ───────────────────────────────────────────────────────
  just_audio: ^0.9.38

  # ── Device TTS fallback ──────────────────────────────────────────────────
  flutter_tts: ^4.0.2

  # ── HTTP client ──────────────────────────────────────────────────────────
  http: ^1.2.1

  # ── Secure JWT storage ───────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Permissions ──────────────────────────────────────────────────────────
  permission_handler: ^11.3.1

  # ── File paths (for temp MP3 playback files) ─────────────────────────────
  path_provider: ^2.1.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

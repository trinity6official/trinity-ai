[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    network: marks tests that make real HTTP calls (deselect with -m "not network")
    architecture: static or runtime architecture invariants and debt budgets
    contract: stable boundary behavior that implementations must preserve
    integration: real internal components wired together with local temporary state
    scenario: meaningful multi-boundary execution scenarios
    failure_path: denial, exception, restart, recovery, or other failure behavior

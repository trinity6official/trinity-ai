# Trinity AI Configuration
identity:
  name: Trinity
  version: "2.0-local"
  born: "2026-02-22"
  mission: "David's wellbeing and financial growth above everything"

david:
  name: David
  timezone: "Asia/Kolkata"
  language: "auto"
  morning_briefing_time: "06:00"
  evening_checkin_time: "20:00"
  weekly_report_day: "Sunday"
  weekly_report_time: "10:00"

company:
  name: Trinity6
  website: "https://trinity6.com"
  github_org: "trinity6official"
  repositories:
    - {name: "Trinity6", type: "scanner", priority: "high"}
    - {name: "assistant", type: "content", priority: "high"}
    - {name: "trinity-ai", type: "brain", priority: "critical"}

local_ai:
  provider: "ollama"
  base_url: "http://127.0.0.1:11434"
  models:
    fast: "qwen3:8b"
    general: "qwen3:14b"
    reasoning: "qwen3:30b"
    coding: "qwen3:14b"
  vision_model: null
  note: "Model names are defaults; benchmark and tune them on the M5 Pro 48 GB."

monitoring:
  github: true
  website: true
  local_ai: true
  security: true
  business: true
  market_news: true
  check_interval_minutes: 60

alerts:
  local_ai_unavailable: true
  website_down_alert: true
  github_failure_alert: true

hardware:
  primary:
    device: "Mac Mini"
    chip: "M5 Pro"
    unified_memory_gb: 48
    mode: "full"
    voice_enabled: true

voice:
  mode: "local"
  tts_provider: "macos-say"
  stt_provider: "whisper-local"
  whisper_model: "small"
  language_detection: true

vision:
  provider: "ollama-local"
  model: null
  screen_awareness_enabled: false
  screen_awareness_interval_seconds: 300
  privacy: "Raw screenshots remain local/in-memory; only local textual context enters awareness."

api:
  enabled: true
  bind: "127.0.0.1"
  port: 8000
  remote_access: "LAN/VPN only after configuring PIN hash and strong JWT secret"

presence:
  enabled: true
  bind: "127.0.0.1"
  port: 8765
  mode: "local-only"

channels:
  local:
    enabled: true
  voice:
    enabled: true

memory:
  legacy_brain_file: "memory/trinity_brain.json"
  sqlite_file: "memory/trinity_memory.db"
  vault_dir: "memory/vault"
  max_conversation_history: 100
  learning_enabled: true

decisions:
  policy_engine: "core.permissions.PermissionEngine"
  default_unknown_action: "confirm"
